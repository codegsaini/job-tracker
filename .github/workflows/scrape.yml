name: Scrape jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC), off the hour to avoid the busy :00 slot
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [config.yml, "scraper/**"]

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scraper/main.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/jobs.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
